<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trackyard — Rental Tracking</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a deep link like /Trackyad/vgo
      // returns this 404 page. Encode the requested path into a query string and
      // bounce to the app root, where index.html restores it before React mounts.
      // seg = number of path segments in the Vite `base` ("/Trackyad/" => 1).
      var seg = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + seg).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(seg).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1) : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
